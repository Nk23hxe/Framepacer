name: Build Complete App

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile 64-bit DLL
        run: |
          cl.exe /LD /O2 /EHsc hook.cpp libMinHook.x64.lib user32.lib d3d11.lib dxgi.lib winmm.lib /Fe:hook.dll

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install PyQt6 pyinstaller

      - name: Package Standalone EXE
        run: |
          pyinstaller --noconsole --onefile main.py -n "Framepacer"

      - name: Bundle Executable and DLL
        run: |
          mkdir release
          move dist\Framepacer.exe release\
          move hook.dll release\

      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: Framepacer-App
          path: release/
